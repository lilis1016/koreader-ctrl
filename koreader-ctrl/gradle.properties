org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=true

# 关键：禁用 SDK 远程 manifest 拉取。
# 本机 SDK 为离线裁剪副本，package.xml 的 JAXB 命名空间不完整，
# AGP 解析失败会回退到远程拉取 manifest 并无限等待（"Still waiting for package manifests"）。
android.builder.sdkDownload=false
android.builder.sdkDownload.autoInstall=false

# 关键：本机为 ARM64 设备（aarch64），而 AGP 从 Maven 拉取的 aapt2 是 x86_64 ELF。
# 直接运行会 "Failed to start AAPT2 process / Process unexpectedly exit"。
# 这里指向用 qemu-x86_64-static 包装过的同一二进制（已验证可用）。
android.aapt2FromMavenOverride=/home/aapt2wrap/aapt2